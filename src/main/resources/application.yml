server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: messaging-service
  mvc:
    problemdetails:
      enabled: true

textbee:
  api-key: ${TEXTBEE_API_KEY:}
  base-url: ${TEXTBEE_BASE_URL:https://api.textbee.dev/api/v1}
  device-id: ${TEXTBEE_DEVICE_ID:}

foodcourt:
  messaging:
    provider: ${MESSAGING_PROVIDER:textbee}
  security:
    jwt-secret: ${JWT_SECRET}
    jwt-ttl: ${JWT_TTL:PT8H}
